services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      # postgres 18+ keeps data in a versioned subdirectory, so mount the parent
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    # cache only for now, no snapshots and no append-only file
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?set REDIS_PORT in .env}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # the controller listener is internal only and is not published
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      # HOST is for the api running on the host, DOCKER is for containers on the compose network
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      # brokers talk to each other over DOCKER, HOST is advertised on a port that only exists on the host
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      # topics are created by kafka-init, a typo in a topic name should fail instead of creating one
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # single node dev cluster, production uses replication 3 with min isr 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      # bootstrap on the DOCKER listener, the HOST listener advertises a port that only exists on the host
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.4.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    # one shot, --if-not-exists makes reruns safe. events keep 7 days, the dlq keeps 30 so a human can look at it
    command:
      - sh
      - -c
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists
        --topic webhook.events --partitions 6 --replication-factor 1 --config retention.ms=604800000
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists
        --topic webhook.events.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # a fixed name so the processor can run the same image without building it a second time
    image: web-hooks-api
    environment:
      API_PORT: 3001
      # inside the compose network postgres and redis use their container ports
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # api does not depend on kafka, registration must keep working while the broker is down
      KAFKA_BROKERS: kafka:9093
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:?set INGEST_API_TOKEN in .env}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # liveness only, the container is healthy when the process answers
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  processor:
    # same image as the api, built once under the api service
    image: web-hooks-api
    pull_policy: never
    command: ["node", "dist/processor.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BROKERS: kafka:9093
      # the shared config class validates these even though the processor never uses them
      REDIS_URL: redis://redis:6379
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:?set INGEST_API_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  delivery-worker:
    # same image as the api, built once under the api service
    image: web-hooks-api
    pull_policy: never
    command: ["node", "dist/delivery-worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # the mock receiver is the only host allowed over http, this is for dev and tests
      DELIVERY_ALLOW_HOSTS: mock-receiver
      # interpolated so a shell override works for manual tests
      DELIVERY_LEASE_MS: ${DELIVERY_LEASE_MS:-60000}
      DELIVERY_REAPER_INTERVAL_MS: ${DELIVERY_REAPER_INTERVAL_MS:-15000}
      # retry and circuit breaker settings, the defaults match the config class
      DELIVERY_RETRY_DELAYS_MS: ${DELIVERY_RETRY_DELAYS_MS:-5000,30000,120000,600000,1800000,7200000,21600000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-8}
      DELIVERY_MAX_AGE_MS: ${DELIVERY_MAX_AGE_MS:-86400000}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-20}
      CIRCUIT_COOLDOWN_MS: ${CIRCUIT_COOLDOWN_MS:-300000}
      CIRCUIT_RELEASE_SPREAD_MS: ${CIRCUIT_RELEASE_SPREAD_MS:-150000}
      # the breaker counters live in redis. kafka brokers and the ingest token are only here
      # because the shared config class validates them
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9093
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:?set INGEST_API_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-receiver:
    # a fake customer server for the delivery smoke scripts, only started with --profile test
    profiles: ["test"]
    image: web-hooks-api
    pull_policy: never
    command: ["node", "dist/dev/mock-receiver.js"]
    ports:
      - "127.0.0.1:${MOCK_RECEIVER_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
      # not for ordering. without a dependent, up --wait counts the exited one-shot as a failure,
      # or as a pass, depending on whether it finished yet. api must not depend on kafka
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: